# Applies Server-Safe suggestions (suggested-changes/*.lua) to the data files, filling only
# entries that have no location yet, and opens a pull request for review. Never pushes to master.
name: apply-suggestions
on:
  push:
    branches: [master]
    paths: ['suggested-changes/**', 'Vanaguide/data/quests.lua', 'Vanaguide/data/missions.lua', 'tools/*suggestions.py', '.github/workflows/apply-suggestions.yml']
  pull_request:
    paths: ['suggested-changes/**', 'Vanaguide/data/quests.lua', 'Vanaguide/data/missions.lua', 'tools/*suggestions.py', '.github/workflows/apply-suggestions.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tool test
        run: python3 tools/test_apply_suggestions.py
      - name: Fill missing givers
        run: python3 tools/apply_suggestions.py | tee "$RUNNER_TEMP/applied.txt"
      - name: Offline tests
        run: sudo apt-get install -y luajit >/dev/null && luajit tools/test_offline.lua
  propose:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Fill missing givers
        run: python3 tools/apply_suggestions.py | tee "$RUNNER_TEMP/applied.txt"
      - name: Pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: apply-suggestions
          base: master
          title: Add suggested quest givers
          commit-message: Add quest givers suggested from VanaGuide Server-Safe
          body-path: ${{ runner.temp }}/applied.txt
          add-paths: Vanaguide/data/*.lua
